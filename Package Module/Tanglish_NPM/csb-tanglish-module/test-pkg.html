<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanglish to Tamil Test</title>
    
    <script>
        window.TANGLISH_NO_AUTO_INIT = true;
    </script>

    <!-- Include the CSS file -->
    <link rel="stylesheet" href="tanglish-to-tamil/dist/tamil-toggle.css">
    
    <!-- Include the JavaScript file -->
    <script src="tanglish-to-tamil/dist/tanglish-to-tamil.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        
        .test-area {
            margin: 20px 0;
        }
        
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        
        h1 {
            color: #333;
        }
        
        .instructions {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>Tanglish to Tamil Converter Test</h1>
    
    <div class="instructions">
        <h3>Instructions:</h3>
        <p>1. Click the "தமிழ்" toggle button in the bottom right corner to enable Tamil typing</p>
        <p>2. Type Tanglish text in the input fields below</p>
        <p>3. The text will automatically convert to Tamil</p>
    </div>
    
    <div class="test-area">
        <h3>Single Line Input Test:</h3>
        <input type="text" placeholder="Type Tanglish here...">
    </div>
    
    <div class="test-area">
        <h3>Multi Line Input Test:</h3>
        <textarea placeholder="Type Tanglish here..."></textarea>
    </div>

    <script>
        // Initialize the Tanglish to Tamil converter
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize with default settings
            window.tamilConverter = window.TanglishToTamil({
                autoAddToggle: true,
                togglePosition: 'bottom-right',
                startEnabled: false,
                placement: {
                    offsetX: 20,
                    offsetY: 20,
                    smartFit: true
                }
            });
        });
    </script>
</body>
</html>
